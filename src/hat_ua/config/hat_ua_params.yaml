# HAT-UA 气象传感器 — 默认参数
# 命令行覆盖: ros2 launch hat_ua hat_ua.launch.py serial_dev:=/dev/hat_ua

hat_ua_driver:
  ros__parameters:

    # -- Modbus 通信 --
    modbus_is_remote: false              # false=本地直连  true=DDS远程调用
    modbus_prefix: "/modbus/hat_ua"      # 总线命名空间前缀
    modbus_leaf_id: 1                    # 从站地址 (1~50, 出厂默认1)

    # -- 串口 --
    serial_is_remote: false              # false=本地串口  true=远程串口
    serial_prefix: "/serial/hat_ua"      # 串口调试话题前缀
    serial_dev_name: "/dev/hat_ua"       # 设备路径: /dev/hat_ua 或 /dev/ttyUSB0
    serial_baud_rate: 9600               # 波特率 (HAT-UA 固定9600)
    serial_data: 8                       # 数据位
    serial_parity: false                 # 校验位 (false=无 true=偶)
    serial_stop: 1                       # 停止位
    serial_flow_control: false           # 硬件流控 (关闭)

    # -- 应用 --
    poll_rate: 1.0                       # 采样频率 Hz
    simulate: false                      # true=仿真模式(无需硬件)
